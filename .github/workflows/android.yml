name: Android build

# Runs deploy/build-android.sh the way it runs on a self-hosted server, so a
# change that breaks the phone build is caught here rather than on the server.
on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LP_PUBLIC_URL: https://lp.example.com
      LP_ANDROID_KEY_PASSWORD: ci-only-password
      # One architecture keeps CI quick; servers build for 32- and 64-bit phones.
      LP_ANDROID_ABIS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the Android tools
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: deploy/build-android.sh
      - name: Check the signed APK and what the download page needs
        run: |
          test -s deploy/downloads/logistics-pro.apk
          cat deploy/downloads/build.json
          grep -q '"bundleId":"com.logisticspro.app"' deploy/downloads/build.json
          test -s deploy/android-keys/release.keystore
          docker run --rm -v "$PWD/deploy/downloads:/d" logisticspro-android apksigner verify --print-certs /d/logistics-pro.apk | grep -q "CN=Logistics Pro"
          docker run --rm -v "$PWD/deploy/downloads:/d" logisticspro-android sh -c '/opt/android-sdk/build-tools/36.0.0/aapt2 dump badging /d/logistics-pro.apk | head -1' > badging.txt
          cat badging.txt
          grep -q "package: name='com.logisticspro.app'" badging.txt
          # The build number from the script, so new builds install over old ones.
          grep -qE "versionCode='[0-9]{7,}'" badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: logistics-pro-apk
          path: deploy/downloads/logistics-pro.apk
          retention-days: 7
