name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lp_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      # Runs the persistence tests against a real database.
      LP_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:mobile
      - run: npm test
      - run: npm run build:web

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      # Starts the API serving the website build, then drives it in Chromium.
      - run: npm run test:e2e
        env:
          CI: "true"
      # The same site built for a path on a shared domain (https://example.com/logistics).
      - name: Browser test under a path
        run: |
          (cd apps/mobile && EXPO_PUBLIC_BASE_PATH=/logistics npx expo export --platform web --output-dir ../../dist/web-base)
          npx playwright test e2e/basepath.spec.ts
        env:
          CI: "true"
          E2E_BASE_PATH: /logistics
          E2E_WEB_DIR: ${{ github.workspace }}/dist/web-base
          E2E_PORT: "8097"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: logisticspro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Runs the image against Postgres the way deploy/docker-compose.yml does,
      # then checks it serves the API, saves to the database and serves the website.
      - name: Start the image with Postgres
        run: |
          docker network create lp
          docker run -d --name db --network lp -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=logisticspro postgres:16
          for i in $(seq 1 30); do docker exec db psql -U postgres -d logisticspro -c "select 1" >/dev/null 2>&1 && break; sleep 2; done
          docker run -d --name api --network lp -p 8080:8080 \
            -e LP_JWT_SECRET=ci-only-secret \
            -e LP_DATABASE_URL=postgres://postgres:ci@db:5432/logisticspro \
            -e LP_PUSH=off \
            logisticspro:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/health && break; sleep 2; done
      - name: Check the API, the database and the website
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS -X POST http://localhost:8080/v1/auth/register -H "content-type: application/json" \
            -d '{"email":"ci@example.com","password":"correct horse battery staple","name":"CI","profileType":"BUSINESS"}' | grep -q enrollToken
          docker exec db psql -U postgres -d logisticspro -tAc "select count(*) from lp_docs where collection = 'accounts' and doc->>'email' = 'ci@example.com'" | grep -qx 1
          curl -fsS -H "accept: text/html" http://localhost:8080/loads | grep -q '<div id="root">'
      - name: Check the self-hosting compose file
        run: cd deploy && LP_JWT_SECRET=ci docker compose config --quiet
      - if: failure()
        run: docker logs api
