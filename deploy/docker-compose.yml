# Logistics Pro on your own server: the API and website, Postgres, truck
# routing (Valhalla), address search (Nominatim) and HTTPS (Caddy).
#
#   deploy/setup.sh lp.example.com you@example.com   # once: writes deploy/.env
#   cd deploy && docker compose up -d --build
#
# First start downloads map data and builds indexes. With the Delaware extract
# below that takes minutes; for the whole United States see docs/NAVIGATION.md
# (hours, and a machine with 32-64 GB RAM and several hundred GB of disk).
#
# Only Caddy is reachable from outside, on ports 80 and 443. The API and the
# routing server listen on this machine only.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      LP_DOMAIN: ${LP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data   # HTTPS certificates
    depends_on: [api]

  api:
    build: ..
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      LP_JWT_SECRET: ${LP_JWT_SECRET:?set LP_JWT_SECRET (run deploy/setup.sh)}
      LP_DATA_KEY: ${LP_DATA_KEY:-}
      LP_PUBLIC_URL: ${LP_PUBLIC_URL:-https://localhost}
      LP_ADMIN_EMAILS: ${LP_ADMIN_EMAILS:-}
      # Named on the privacy policy at /privacy.
      LP_OPERATOR_NAME: ${LP_OPERATOR_NAME:-}
      LP_PRIVACY_CONTACT: ${LP_PRIVACY_CONTACT:-}
      LP_VALHALLA_URL: http://valhalla:8002
      LP_GEOCODER: nominatim
      LP_GEOCODER_URL: http://nominatim:8080
      LP_AS2_ID: ${LP_AS2_ID:-LOGISTICSPRO}
      LP_DATABASE_URL: postgres://logisticspro:${DB_PASSWORD:-change-me}@db:5432/logisticspro
      # Expo's push service is outside this server, so push is off unless you turn it on.
      LP_PUSH: ${LP_PUSH:-off}
      LP_DOWNLOADS_DIR: /srv/downloads
      LP_FMCSA_WEBKEY: ${LP_FMCSA_WEBKEY:-}
      LP_TRAFFIC: ${LP_TRAFFIC:-}
      LP_TRAFFIC_KEY: ${LP_TRAFFIC_KEY:-}
    volumes:
      - lp-data:/data   # keeps the AS2 station certificate across restarts
      - ./downloads:/srv/downloads:ro   # phone app builds from deploy/build-android.sh
    depends_on:
      db: { condition: service_healthy }
      valhalla: { condition: service_started }
      nominatim: { condition: service_started }
    # Scale out with `docker compose up -d --scale api=3` behind a load balancer;
    # every API server shares the database, and one runs background jobs.

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: logisticspro
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: logisticspro
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logisticspro"]
      interval: 5s
      retries: 20

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8002:8002"]
    environment:
      # One or more space-separated PBF extracts. For the US use
      # https://download.geofabrik.de/north-america/us-latest.osm.pbf
      tile_urls: ${MAP_PBF_URL:-https://download.geofabrik.de/north-america/us/delaware-latest.osm.pbf}
      serve_tiles: "True"
      build_admins: "True"
      build_time_zones: "True"
    volumes:
      - valhalla-files:/custom_files

  nominatim:
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    shm_size: 1g
    environment:
      PBF_URL: ${MAP_PBF_URL:-https://download.geofabrik.de/north-america/us/delaware-latest.osm.pbf}
      REPLICATION_URL: ${MAP_UPDATES_URL:-https://download.geofabrik.de/north-america/us/delaware-updates/}
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-change-me}
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main

volumes:
  caddy-data:
  db-data:
  lp-data:
  valhalla-files:
  nominatim-data:
